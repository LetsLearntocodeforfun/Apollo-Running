# Keeps npm packages and GitHub Actions (pinned to commit SHAs) up to date.
# Grouped weekly so updates arrive as a few reviewable PRs, each tested by CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Major upgrades of these change app behaviour and need a manual test pass.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
