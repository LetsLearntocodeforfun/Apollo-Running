<!doctype html>
<!--
  Source of Apollo's link-preview images (Art Deco navy + gold, the app's own
  fonts, a real screenshot from docs/images):
    public/og-image.png               1200x630  Open Graph / Twitter card for the web version
    .github/social/social-preview.png 1280x640  GitHub repository social preview
  Regenerate after changing this file or the screenshot:
    node scripts/render-social-cards.mjs
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apollo social card</title>
    <style>
      @font-face {
        font-family: 'Montserrat Variable';
        src: url('../../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Inter Variable';
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      :root {
        --gold: #d4a537;
        --gold-light: #e8c05a;
        --gold-dark: #b8892a;
        --navy: #0d1b2a;
        --cream: #f5e6c8;
        --text: #ece8e1;
        --text2: #b8b2a8;
        --teal: #5bb5b5;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        position: relative;
        overflow: hidden;
        font-family: 'Inter Variable', sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 60% 75% at 14% 26%, rgba(212, 165, 55, 0.17), transparent 70%),
          radial-gradient(ellipse 55% 60% at 96% 104%, rgba(91, 181, 181, 0.12), transparent 70%),
          linear-gradient(158deg, #12263d 0%, #0d1b2a 52%, #09141f 100%);
      }
      /* Art Deco double frame */
      .frame {
        position: absolute;
        inset: 18px;
        border: 1.5px solid rgba(212, 165, 55, 0.55);
        border-radius: 3px;
      }
      .frame::after {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(212, 165, 55, 0.2);
      }
      /* Stepped Art Deco corners */
      .corner {
        position: absolute;
        width: 34px;
        height: 34px;
        border-color: var(--gold);
        border-style: solid;
        border-width: 0;
      }
      .corner::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--gold);
        transform: rotate(45deg);
      }
      .tl {
        left: 30px;
        top: 30px;
        border-left-width: 3px;
        border-top-width: 3px;
      }
      .tl::after {
        left: 8px;
        top: 8px;
      }
      .tr {
        right: 30px;
        top: 30px;
        border-right-width: 3px;
        border-top-width: 3px;
      }
      .tr::after {
        right: 8px;
        top: 8px;
      }
      .bl {
        left: 30px;
        bottom: 30px;
        border-left-width: 3px;
        border-bottom-width: 3px;
      }
      .bl::after {
        left: 8px;
        bottom: 8px;
      }
      .left {
        position: absolute;
        left: 70px;
        top: 58px;
        width: 560px;
        z-index: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand img {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow:
          0 0 0 2px rgba(212, 165, 55, 0.75),
          0 0 0 7px rgba(212, 165, 55, 0.12),
          0 10px 26px rgba(0, 0, 0, 0.5);
      }
      .wordmark {
        font-family: 'Montserrat Variable', sans-serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.24em;
        background: linear-gradient(180deg, #f3d57e 0%, #d4a537 58%, #b8892a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 300px;
        margin: 26px 0 0 2px;
      }
      .divider span {
        flex: 1;
        height: 1.5px;
        background: linear-gradient(90deg, rgba(212, 165, 55, 0.9), rgba(212, 165, 55, 0.25));
      }
      .divider span:first-child {
        flex: 0 0 46px;
        background: rgba(212, 165, 55, 0.9);
      }
      .divider i {
        width: 9px;
        height: 9px;
        background: var(--gold);
        transform: rotate(45deg);
      }
      h1 {
        font-family: 'Montserrat Variable', sans-serif;
        font-weight: 700;
        font-size: 47px;
        line-height: 1.13;
        letter-spacing: -0.005em;
        margin: 24px 0 0;
        color: var(--cream);
      }
      h1 em {
        font-style: normal;
        color: var(--gold-light);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
      }
      li {
        position: relative;
        font-size: 24px;
        line-height: 1.3;
        font-weight: 500;
        margin: 0 0 13px;
        padding-left: 32px;
        color: var(--text);
      }
      li::before {
        content: '';
        position: absolute;
        left: 5px;
        top: 10px;
        width: 10px;
        height: 10px;
        background: var(--gold);
        transform: rotate(45deg);
      }
      .footer {
        position: absolute;
        left: 72px;
        bottom: 52px;
        z-index: 2;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text2);
      }
      .footer b {
        color: var(--gold-light);
        font-weight: 600;
      }
      .shot {
        position: absolute;
        left: 655px;
        top: 74px;
        width: 780px;
        height: 640px;
        z-index: 3;
        border-radius: 16px;
        overflow: hidden;
        border: 1.5px solid rgba(212, 165, 55, 0.65);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.6),
          0 0 0 7px rgba(212, 165, 55, 0.07);
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="left">
      <div class="brand">
        <img src="../../public/assets/logo-512.png" alt="" />
        <div class="wordmark">APOLLO</div>
      </div>
      <div class="divider"><span></span><i></i><span></span></div>
      <h1>Free marathon training that <em>stays on your device.</em></h1>
      <ul>
        <li>33 training plans, novice to advanced</li>
        <li>Garmin Connect &amp; intervals.icu sync</li>
        <li>Race-day pacing &amp; fueling plans</li>
      </ul>
    </div>
    <div class="footer"><b>Windows · macOS · Linux · Web</b> &nbsp;·&nbsp; no account needed</div>
    <div class="shot">
      <img src="../../docs/images/03-today-dashboard.png" alt="" />
    </div>
  </body>
</html>
