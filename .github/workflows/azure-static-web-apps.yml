name: Azure Static Web Apps (manual)

# v1.0.7 (PX-01): this deploy failed on every push because no Azure token is
# configured, which kept CI permanently red. Apollo is desktop-first, so the
# web deploy now runs only when started by hand (Actions → Run workflow) after
# hosting has been set up. Before hosting the web build publicly, fix the web
# Strava login (PX-02 hash-router callback, PX-08 OAuth state/PKCE).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-24.04
    name: Build and Deploy Job
    steps:
      - name: Require the Azure deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Set the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret first (README → Deploy to Azure Static Web Apps)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: 'api'
          output_location: 'dist'
          app_build_command: 'npm ci && npm run build:web'
        env:
          CI: true
