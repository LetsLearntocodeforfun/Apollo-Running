name: Build & Release Electron Installers

# Tags like v1.0.7 build, verify and publish installers for Windows, macOS and
# Linux. "Run workflow" (workflow_dispatch) does a full dry run: it builds every
# installer and the checksum file as downloadable workflow artifacts but
# publishes nothing, so the pipeline can be tested before tagging.
#
# v1.0.7 hardening (PX-06):
# - least privilege: read-only by default; only the publish job can write;
# - every third-party action is pinned to a commit SHA (Dependabot updates them);
# - SHA256SUMS.txt and GitHub build-provenance attestations for every installer,
#   so anyone can verify a download came from this repository's CI;
# - Node 22; Linux builds pinned to Ubuntu 24.04.
#
# Code signing (see docs/SIGNING.md): macOS signing/notarization switches on
# automatically when the MAC_CSC_LINK / APPLE_* secrets exist. Without them the
# Apple Silicon build is ad-hoc signed (electron-builder's fallback) and the
# Intel build is unsigned, exactly as in v1.0.6.
#
# Windows signing (SignPath Foundation, free for open source) switches on when
# the SIGNPATH_ORGANIZATION_ID repository variable and the SIGNPATH_API_TOKEN
# secret both exist. Until then the Windows job builds exactly as before. When
# on, the app (Apollo.exe + DLLs) is signed first, the installer is built from
# the signed app, then the installer itself is signed and latest.yml/blockmap
# are refreshed so auto-update accepts it.
#
# Microsoft Store: the separate "store" job builds an AppX package (signed by
# the Store on upload) only when the MS_STORE_IDENTITY_NAME variable exists. It
# is uploaded as a workflow artifact for Partner Center, never to the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Step 0: Refuse to release anything that doesn't type-check and pass tests ───
  verify:
    name: Verify (version, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Electron itself isn't launched here; electron-builder downloads its own copy later.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      # The tag must match package.json, otherwise latest*.yml (auto-update)
      # would advertise a different version than the tag/release.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit & component tests
        run: npx vitest run

  # ─── Step 1: Build installers on each platform in parallel ───
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-24.04
            platform: linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # SignPath reads this job's details and downloads the unsigned artifact
    env:
      # 'true' only on the Windows job once SignPath is configured (docs/SIGNING.md).
      SIGN_WINDOWS: ${{ matrix.platform == 'win' && vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
      # SignPath Foundation projects get a test and a release signing policy;
      # dry runs use the test policy so they never consume a release approval.
      SIGNPATH_POLICY: ${{ startsWith(github.ref, 'refs/tags/') && (vars.SIGNPATH_RELEASE_POLICY_SLUG || 'release-signing') || (vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      # Linux needs additional system libraries for building deb/AppImage
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm dpkg fakeroot

      - name: Install dependencies
        run: npm ci

      # Build the Vite renderer + Electron main/preload via vite-plugin-electron
      - name: Build Electron app
        run: npm run build:electron

      # Build installers WITHOUT publishing (the publish job attaches them).
      - name: Package installers
        if: env.SIGN_WINDOWS != 'true'
        run: npx electron-builder --publish never
        env:
          # Keychain discovery only when a macOS signing certificate is provided;
          # otherwise electron-builder ad-hoc signs the Apple Silicon build.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          # Optional macOS Developer ID signing + notarization (docs/SIGNING.md).
          # Scoped to the mac job so a macOS certificate is never used on Windows.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      # ── Windows + SignPath (only when SIGN_WINDOWS is 'true') ──────────────
      # 1. Package the app folder only (release/win-unpacked), unsigned.
      - name: 'SignPath 1/6: package unsigned app folder'
        if: env.SIGN_WINDOWS == 'true'
        run: npx electron-builder --win dir --publish never

      - name: 'SignPath 2/6: upload unsigned app folder'
        id: upload-unsigned-app
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-unpacked-unsigned
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 1

      # 2. Sign Apollo.exe and the bundled DLLs (artifact configuration
      #    "apollo-app", see docs/SIGNING.md), then put the signed folder back.
      - name: 'SignPath 3/6: sign app folder'
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Apollo-Running' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIG_SLUG || 'apollo-app' }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/win-unpacked-signed

      # 3. Build the NSIS installer from the signed app folder.
      - name: 'SignPath 4/6: build installer from signed app'
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          rm -rf release/win-unpacked
          mv release/win-unpacked-signed release/win-unpacked
          npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      - name: 'SignPath 5/6: upload unsigned installer'
        id: upload-unsigned-installer
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-installer-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

      # 4. Sign the installer (artifact configuration "apollo-installer"), then
      #    refresh latest.yml + blockmap so electron-updater accepts the signed file.
      - name: 'SignPath 6/6: sign installer'
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Apollo-Running' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG || 'apollo-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed-installer

      - name: Use signed installer and refresh update metadata
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          signed=(release/signed-installer/*.exe)
          if [ ${#signed[@]} -eq 0 ]; then echo "::error::SignPath returned no installer"; exit 1; fi
          cp -f "${signed[@]}" release/
          node scripts/update-latest-yml.mjs release

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/*.exe) + @(Get-Item release/win-unpacked/Apollo.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

      # Upload installer files as workflow artifacts
      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 5

  # ─── Optional: Microsoft Store package (AppX) ───
  # Off until the MS_STORE_* repository variables are set (docs/SIGNING.md).
  # Not part of the GitHub Release: upload the .appx in Partner Center, where
  # Microsoft signs it. Store installs update through the Store (electron/main.ts).
  store:
    name: Build (Microsoft Store)
    needs: verify
    if: ${{ vars.MS_STORE_IDENTITY_NAME != '' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron

      - name: Package AppX
        run: npx electron-builder --win --config electron-builder.store.cjs --publish never
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}

      - name: Upload Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store-package
          path: release/*.appx
          if-no-files-found: error
          retention-days: 30

  # ─── Step 2: Checksums, provenance, and (for tags) the GitHub Release ───
  publish:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Release' || 'Dry run (no release)' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write          # create the GitHub Release (tags only)
      id-token: write          # sign the build-provenance attestation (Sigstore)
      attestations: write      # store the attestation
      artifact-metadata: write # link the attestation to the release assets

    steps:
      - name: Checkout repository (release notes template)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: false

      # Collect all installer files into a flat directory
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.blockmap' -o -name '*.yml' \
          \) -exec cp {} release/ \;
          echo "=== Files to release ==="
          ls -lh release/

      # Lets people check a download with `shasum -a 256 -c SHA256SUMS.txt`
      # (macOS/Linux) or `Get-FileHash` (Windows). See docs/INSTALL.md.
      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: |
          shopt -s nullglob
          files=(*.exe *.dmg *.zip *.AppImage *.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installers to checksum"; exit 1; fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dry-run bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: release/*
          retention-days: 5

      # Free supply-chain proof: `gh attestation verify <file> -R LetsLearntocodeforfun/Apollo-Running`
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          body_path: .github/release-notes/INSTALL_NOTES.md
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
