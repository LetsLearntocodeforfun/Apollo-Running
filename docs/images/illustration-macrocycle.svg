<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="macro-title macro-desc">
  <title id="macro-title">The Complete Marathon Training Macrocycle in Apollo</title>
  <desc id="macro-desc">How weekly volume, 4th-week recovery cutbacks, fitness (CTL), and freshness (TSB) progress across Base, Build, Peak, Taper, Race Day, and Post-Marathon Recovery.</desc>
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1724" />
      <stop offset="100%" stop-color="#112236" />
    </linearGradient>
    <linearGradient id="barBuild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A537" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D4A537" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="barCutback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C75E" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#B88924" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="14" fill="url(#mBg)" />
  <rect x="14" y="14" width="1172" height="532" rx="10" fill="none" stroke="#D4A537" stroke-opacity="0.28" />

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#D4A537" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3">PERIODIZATION ARCHITECTURE · 18-WEEK MARATHON BLOCK + RECOVERY</text>
  <text x="600" y="80" text-anchor="middle" fill="#E8EDF2" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="22" font-weight="700">Volume Progression, Cutback Rhythm &amp; Race-Morning Form (CTL / TSB)</text>

  <!-- Phase Ribbon -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">
    <rect x="70" y="106" width="125" height="32" rx="6" fill="#18324C" stroke="#4FC3F7" stroke-opacity="0.5" />
    <text x="132" y="126" text-anchor="middle" fill="#81D4FA">PRE-BLOCK BASE</text>

    <rect x="203" y="106" width="182" height="32" rx="6" fill="#18324C" stroke="#2EC4B6" stroke-opacity="0.6" />
    <text x="294" y="126" text-anchor="middle" fill="#2EC4B6">BASE (WEEKS 1–4)</text>

    <rect x="393" y="106" width="318" height="32" rx="6" fill="#1D354D" stroke="#D4A537" stroke-opacity="0.65" />
    <text x="552" y="126" text-anchor="middle" fill="#ECC86A">BUILD · SPECIFICITY (WEEKS 5–11)</text>

    <rect x="719" y="106" width="176" height="32" rx="6" fill="#2A3A3A" stroke="#F0C75E" stroke-width="1.5" />
    <text x="807" y="126" text-anchor="middle" fill="#F0C75E">PEAK (WEEKS 12–15)</text>

    <rect x="903" y="106" width="132" height="32" rx="6" fill="#16363A" stroke="#2EC4B6" stroke-width="1.5" />
    <text x="969" y="126" text-anchor="middle" fill="#2EC4B6">TAPER &amp; RACE</text>

    <rect x="1043" y="106" width="102" height="32" rx="6" fill="#172A3E" stroke="#94A6B8" stroke-opacity="0.5" />
    <text x="1094" y="126" text-anchor="middle" fill="#CBD5E1">REVERSE TAPER</text>
  </g>

  <!-- Chart Grid -->
  <g stroke="#243B53" stroke-width="1" stroke-dasharray="3 4">
    <line x1="70" y1="180" x2="1145" y2="180" />
    <line x1="70" y1="240" x2="1145" y2="240" />
    <line x1="70" y1="300" x2="1145" y2="300" />
    <line x1="70" y1="360" x2="1145" y2="360" />
  </g>
  <line x1="70" y1="410" x2="1145" y2="410" stroke="#486581" stroke-width="1.4" />

  <!-- Y Axis Labels -->
  <g fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="10.5" text-anchor="end">
    <text x="62" y="184">100% Peak</text>
    <text x="62" y="244">75%</text>
    <text x="62" y="304">50%</text>
    <text x="62" y="364">25%</text>
  </g>

  <!-- Weekly Volume Bars (Pre-base 3w + 18w marathon + 2w recovery = 23 bars) -->
  <!-- x starts at 80, step 46px, bar width 30px -->
  <g>
    <!-- Pre-base -->
    <rect x="80" y="312" width="28" height="98" rx="3" fill="#4FC3F7" fill-opacity="0.32" />
    <rect x="124" y="298" width="28" height="112" rx="3" fill="#4FC3F7" fill-opacity="0.38" />
    <rect x="168" y="286" width="28" height="124" rx="3" fill="#4FC3F7" fill-opacity="0.44" />

    <!-- W1..W4 (W4 cutback) -->
    <rect x="212" y="282" width="28" height="128" rx="3" fill="url(#barBuild)" />
    <rect x="256" y="268" width="28" height="142" rx="3" fill="url(#barBuild)" />
    <rect x="300" y="254" width="28" height="156" rx="3" fill="url(#barBuild)" />
    <rect x="344" y="276" width="28" height="134" rx="3" fill="url(#barCutback)" />

    <!-- W5..W8 (W8 cutback) -->
    <rect x="388" y="244" width="28" height="166" rx="3" fill="url(#barBuild)" />
    <rect x="432" y="230" width="28" height="180" rx="3" fill="url(#barBuild)" />
    <rect x="476" y="216" width="28" height="194" rx="3" fill="url(#barBuild)" />
    <rect x="520" y="242" width="28" height="168" rx="3" fill="url(#barCutback)" />

    <!-- W9..W11 -->
    <rect x="564" y="208" width="28" height="202" rx="3" fill="url(#barBuild)" />
    <rect x="608" y="198" width="28" height="212" rx="3" fill="url(#barBuild)" />
    <rect x="652" y="222" width="28" height="188" rx="3" fill="url(#barCutback)" />

    <!-- W12..W15 Peak -->
    <rect x="696" y="190" width="28" height="220" rx="3" fill="url(#barPeak)" />
    <rect x="740" y="182" width="28" height="228" rx="3" fill="url(#barPeak)" />
    <rect x="784" y="176" width="28" height="234" rx="3" fill="url(#barPeak)" />
    <rect x="828" y="196" width="28" height="214" rx="3" fill="url(#barPeak)" />

    <!-- W16..W18 Taper + Race -->
    <rect x="872" y="240" width="28" height="170" rx="3" fill="url(#barCutback)" />
    <rect x="916" y="286" width="28" height="124" rx="3" fill="url(#barCutback)" />
    <rect x="960" y="330" width="28" height="80" rx="3" fill="#F0C75E" />

    <!-- Post-Marathon Reverse Taper -->
    <rect x="1048" y="374" width="28" height="36" rx="3" fill="#64748B" fill-opacity="0.55" />
    <rect x="1092" y="346" width="28" height="64" rx="3" fill="#64748B" fill-opacity="0.65" />
  </g>

  <!-- CTL Fitness Curve (Gold Smooth Line) -->
  <path d="M 94 345 C 220 328, 360 292, 500 258 C 640 224, 760 194, 835 190 C 895 192, 945 204, 974 210 C 1020 226, 1070 252, 1106 266" fill="none" stroke="#F0C75E" stroke-width="3.2" />

  <!-- TSB Form Curve (Teal Dashed Line rising cleanly in Taper!) -->
  <path d="M 94 295 C 220 316, 330 330, 358 302 C 410 334, 490 344, 534 308 C 600 346, 750 356, 800 352 C 855 344, 915 262, 974 226 C 1010 368, 1060 320, 1106 292" fill="none" stroke="#2EC4B6" stroke-width="2.6" stroke-dasharray="6 4" />

  <!-- Callout Badges -->
  <!-- Cutback Callout -->
  <circle cx="358" cy="276" r="5" fill="#2EC4B6" />
  <circle cx="534" cy="242" r="5" fill="#2EC4B6" />
  <text x="446" y="166" text-anchor="middle" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Every 3–4 weeks: ~15–20% Cutback Week absorbs load</text>

  <!-- Race Day Star Marker -->
  <line x1="974" y1="150" x2="974" y2="410" stroke="#F0C75E" stroke-width="1.6" stroke-dasharray="3 3" />
  <circle cx="974" cy="226" r="7" fill="#2EC4B6" stroke="#0B1724" stroke-width="2" />
  <rect x="852" y="148" width="196" height="44" rx="6" fill="#0D1C2E" stroke="#F0C75E" stroke-width="1.2" />
  <text x="950" y="167" text-anchor="middle" fill="#F0C75E" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">RACE-MORNING FORM</text>
  <text x="950" y="183" text-anchor="middle" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="11">TSB +15 to +25 · Peak Freshness</text>

  <!-- Week Labels -->
  <g fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">
    <text x="138" y="430">Base Builder</text>
    <text x="226" y="430">W1</text>
    <text x="358" y="430">W4 ↓</text>
    <text x="490" y="430">W7</text>
    <text x="534" y="430">W8 ↓</text>
    <text x="666" y="430">W11 ↓</text>
    <text x="798" y="430">W14 Peak</text>
    <text x="886" y="430">W16</text>
    <text x="930" y="430">W17</text>
    <text x="974" y="430" fill="#F0C75E" font-weight="700">RACE</text>
    <text x="1084" y="430">Recovery 4w</text>
  </g>

  <!-- Bottom Phase Coaching Summary Cards -->
  <g font-family="Inter, -apple-system, sans-serif">
    <rect x="70" y="452" width="255" height="78" rx="8" fill="#13263B" stroke="#334E68" />
    <text x="86" y="474" fill="#2EC4B6" font-size="12" font-weight="700">Base &amp; Early Build</text>
    <text x="86" y="493" fill="#E8EDF2" font-size="11">80%+ easy conversational miles (Z1–Z2).</text>
    <text x="86" y="510" fill="#94A6B8" font-size="11">Build Efficiency Factor; protect consistency.</text>

    <rect x="340" y="452" width="265" height="78" rx="8" fill="#13263B" stroke="#334E68" />
    <text x="356" y="474" fill="#ECC86A" font-size="12" font-weight="700">Specificity &amp; Peak Weeks</text>
    <text x="356" y="493" fill="#E8EDF2" font-size="11">TSB sits at −10 to −20 (Productive load).</text>
    <text x="356" y="510" fill="#94A6B8" font-size="11">Target Pa:HR ≤ 5% on long runs + gut rehearsal.</text>

    <rect x="620" y="452" width="260" height="78" rx="8" fill="#13263B" stroke="#334E68" />
    <text x="636" y="474" fill="#2EC4B6" font-size="12" font-weight="700">Taper (Final 2–3 Weeks)</text>
    <text x="636" y="493" fill="#E8EDF2" font-size="11">Cut volume to ~72% then ~45%; keep light MP.</text>
    <text x="636" y="510" fill="#94A6B8" font-size="11">Fatigue sheds fast while 42-day CTL stays high.</text>

    <rect x="895" y="452" width="250" height="78" rx="8" fill="#13263B" stroke="#334E68" />
    <text x="911" y="474" fill="#CBD5E1" font-size="12" font-weight="700">Legend</text>
    <line x1="911" y1="490" x2="938" y2="490" stroke="#F0C75E" stroke-width="3" />
    <text x="946" y="494" fill="#E8EDF2" font-size="11">CTL (42-day Fitness)</text>
    <line x1="911" y1="510" x2="938" y2="510" stroke="#2EC4B6" stroke-width="2.5" stroke-dasharray="5 3" />
    <text x="946" y="514" fill="#E8EDF2" font-size="11">TSB (CTL − ATL Form)</text>
  </g>
</svg>
