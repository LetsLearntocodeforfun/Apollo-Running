<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="zones-title zones-desc">
  <title id="zones-title">Apollo VDOT Pace Zones, Heart-Rate Zones, and the 80/20 Coaching Loop</title>
  <desc id="zones-desc">Comparison of Apollo's five heart-rate and VDOT pace zones alongside the four-step daily training workflow.</desc>
  <defs>
    <linearGradient id="zBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1724" />
      <stop offset="100%" stop-color="#112236" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="14" fill="url(#zBg)" />
  <rect x="14" y="14" width="1172" height="492" rx="10" fill="none" stroke="#D4A537" stroke-opacity="0.28" />

  <text x="600" y="48" text-anchor="middle" fill="#D4A537" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3">INTENSITY CALIBRATION &amp; DAILY EXECUTION</text>
  <text x="600" y="78" text-anchor="middle" fill="#E8EDF2" font-family="Montserrat, Inter, -apple-system, sans-serif" font-size="22" font-weight="700">The 80/20 Intensity Pyramid &amp; Your Daily Apollo Rhythm</text>

  <!-- LEFT PANEL: 5 ZONES and 80/20 RULE -->
  <rect x="44" y="104" width="620" height="378" rx="10" fill="#13263B" stroke="#334E68" />
  <text x="68" y="134" fill="#ECC86A" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Heart-Rate &amp; Daniels VDOT Intensity Alignment</text>
  <text x="68" y="154" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11.5">Keep ~80% of weekly volume in Zones 1–2 so your 20% quality sessions hit true physiological targets.</text>

  <!-- Zone 5 -->
  <rect x="68" y="174" width="572" height="46" rx="6" fill="#0D1C2E" stroke="#EF5350" stroke-opacity="0.65" />
  <rect x="68" y="174" width="8" height="46" rx="3" fill="#EF5350" />
  <text x="88" y="195" fill="#FF8A80" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700">Z5 · VO₂ Max (90–100% Max HR)</text>
  <text x="88" y="211" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Daniels Interval (I) &amp; Repetition (R) · 400m–1600m track/road repeats · Aerobic ceiling</text>
  <text x="624" y="201" text-anchor="end" fill="#FF8A80" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">≤ 5% vol</text>

  <!-- Zone 4 -->
  <rect x="68" y="230" width="572" height="46" rx="6" fill="#0D1C2E" stroke="#FFA726" stroke-opacity="0.65" />
  <rect x="68" y="230" width="8" height="46" rx="3" fill="#FFA726" />
  <text x="88" y="251" fill="#FFCC80" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700">Z4 · Lactate Threshold (80–90% Max HR)</text>
  <text x="88" y="267" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Daniels Threshold (T) · Continuous, progressive &amp; cruise tempos · Clears blood lactate</text>
  <text x="624" y="257" text-anchor="end" fill="#FFCC80" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">~10–15% vol</text>

  <!-- Zone 3 -->
  <rect x="68" y="286" width="572" height="46" rx="6" fill="#0D1C2E" stroke="#66BB6A" stroke-opacity="0.65" />
  <rect x="68" y="286" width="8" height="46" rx="3" fill="#66BB6A" />
  <text x="88" y="307" fill="#A5D6A7" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700">Z3 · Marathon Specific / Steady (70–80% Max HR)</text>
  <text x="88" y="323" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Daniels Marathon (M) · Goal race pace blocks &amp; MP-finish long runs · Fueling rehearsal</text>
  <text x="624" y="313" text-anchor="end" fill="#A5D6A7" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">Specific MP</text>

  <!-- Zone 2 -->
  <rect x="68" y="342" width="572" height="54" rx="6" fill="#10293E" stroke="#4FC3F7" stroke-width="1.4" />
  <rect x="68" y="342" width="8" height="54" rx="3" fill="#4FC3F7" />
  <text x="88" y="364" fill="#81D4FA" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">Z2 · Aerobic Endurance (60–70% Max HR)</text>
  <text x="88" y="382" fill="#E8EDF2" font-family="Inter, -apple-system, sans-serif" font-size="11">Daniels Easy (E) &amp; Steady Long Runs · Capillary density, mitochondria &amp; Pa:HR ≤ 5% coupling</text>
  <text x="624" y="373" text-anchor="end" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700">~80% Z1+Z2</text>

  <!-- Zone 1 -->
  <rect x="68" y="406" width="572" height="52" rx="6" fill="#0D1C2E" stroke="#78909C" stroke-opacity="0.65" />
  <rect x="68" y="406" width="8" height="52" rx="3" fill="#78909C" />
  <text x="88" y="428" fill="#B0BEC5" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700">Z1 · Active Recovery (50–60% Max HR)</text>
  <text x="88" y="446" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Shakeouts, post-workout days &amp; PM doubles · Restores blood flow without adding fatigue</text>
  <text x="624" y="436" text-anchor="end" fill="#B0BEC5" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">Recovery</text>

  <!-- RIGHT PANEL: THE 4-STEP DAILY COACHING LOOP -->
  <rect x="688" y="104" width="468" height="378" rx="10" fill="#13263B" stroke="#D4A537" stroke-opacity="0.45" />
  <text x="712" y="134" fill="#ECC86A" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">The 4-Step Daily Coaching Loop</text>
  <text x="712" y="154" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11.5">Two minutes in the morning, automatic feedback after your run.</text>

  <!-- Step 1 -->
  <rect x="712" y="174" width="420" height="64" rx="7" fill="#0D1C2E" stroke="#2EC4B6" stroke-opacity="0.45" />
  <circle cx="740" cy="206" r="14" fill="#2EC4B6" fill-opacity="0.18" stroke="#2EC4B6" />
  <text x="740" y="210" text-anchor="middle" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="766" y="198" fill="#E8EDF2" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">Morning Check on Today</text>
  <text x="766" y="216" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Read Today's Hero pace target, Form chip &amp; Recovery status</text>
  <text x="766" y="230" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="10.5">(If Recovery says Caution on a hard day → Move or convert to Easy)</text>

  <!-- Step 2 -->
  <rect x="712" y="250" width="420" height="60" rx="7" fill="#0D1C2E" stroke="#D4A537" stroke-opacity="0.4" />
  <circle cx="740" cy="280" r="14" fill="#D4A537" fill-opacity="0.18" stroke="#D4A537" />
  <text x="740" y="284" text-anchor="middle" fill="#ECC86A" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="766" y="274" fill="#E8EDF2" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">Run by Watch Steps or Effort</text>
  <text x="766" y="293" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Start the structured workout pushed to your watch, or run</text>
  <text x="766" y="306" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="10.5">unplugged and drop the FIT/GPX file in later.</text>

  <!-- Step 3 -->
  <rect x="712" y="322" width="420" height="60" rx="7" fill="#0D1C2E" stroke="#D4A537" stroke-opacity="0.4" />
  <circle cx="740" cy="352" r="14" fill="#D4A537" fill-opacity="0.18" stroke="#D4A537" />
  <text x="740" y="356" text-anchor="middle" fill="#ECC86A" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="766" y="346" fill="#E8EDF2" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">Auto-Sync &amp; Daily Recap</text>
  <text x="766" y="365" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Apollo matches your run (±2-day window), checks split</text>
  <text x="766" y="378" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="10.5">consistency, updates shoe wear, and grades execution.</text>

  <!-- Step 4 -->
  <rect x="712" y="394" width="420" height="68" rx="7" fill="#0D1C2E" stroke="#2EC4B6" stroke-opacity="0.45" />
  <circle cx="740" cy="428" r="14" fill="#2EC4B6" fill-opacity="0.18" stroke="#2EC4B6" />
  <text x="740" y="432" text-anchor="middle" fill="#2EC4B6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="766" y="418" fill="#E8EDF2" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">Sunday Weekly Review on Progress</text>
  <text x="766" y="436" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="11">Check Weekly Readiness (A+ to D), CTL/TSB Form, Long-Run</text>
  <text x="766" y="450" fill="#94A6B8" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Pa:HR durability, and any Adaptive Plan Recommendations.</text>
</svg>
